# Versione finale con HTTPS, da usare SOLO quando i certificati esistono già
# (perché li gestisci tu, oppure perché certbot è già passato).
#
# Per una prima installazione parti da nginx-bancarella.conf e lascia fare a
# `certbot --nginx`: è la strada che sbaglia meno.
#
#   cp deploy/nginx-bancarella-tls.conf /etc/nginx/conf.d/bancarella.conf
#   nginx -t && systemctl reload nginx
#
# Ricorda, su AlmaLinux/RHEL: setsebool -P httpd_can_network_connect 1

# HTTP: solo redirect, tranne la cartella per i rinnovi del certificato.
server {
    listen 80;
    listen [::]:80;
    server_name bancarella.esempio.it;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bancarella.esempio.it;

    ssl_certificate     /etc/letsencrypt/live/bancarella.esempio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bancarella.esempio.it/privkey.pem;
    # Parametri condivisi installati da certbot; se non ci sono, commenta.
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bancarella.access.log;
    error_log  /var/log/nginx/bancarella.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
