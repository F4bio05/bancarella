# Virtual host per Bancarella su un server che ospita più siti.
#
# Questo è il PRIMO passo: solo HTTP. Serve così perché certbot deve poter
# raggiungere il sito in chiaro per emettere il certificato; se il file citasse
# subito i .pem di Let's Encrypt, che ancora non esistono, `nginx -t`
# fallirebbe e nginx non ripartirebbe (buttando giù anche gli altri siti).
#
#   cp deploy/nginx-bancarella.conf /etc/nginx/conf.d/bancarella.conf
#   $EDITOR /etc/nginx/conf.d/bancarella.conf     # metti il tuo dominio
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bancarella.esempio.it
#
# L'ultimo comando riscrive DA SÉ questo file: aggiunge il blocco sulla 443 con
# i certificati e il redirect da HTTP a HTTPS. Da quel momento non serve altro.
# Se preferisci scriverlo a mano, in nginx-bancarella-tls.conf trovi il
# risultato finale già pronto.
#
# Convivenza con gli altri siti:
#   - nessun `default_server`: questo blocco risponde solo al suo server_name,
#     gli altri continuano a rispondere ai loro;
#   - log separati, così gli accessi di questo sito non si mescolano;
#   - su AlmaLinux/RHEL i file dei singoli siti vanno in /etc/nginx/conf.d/,
#     che nginx.conf include già: non c'è niente da modificare altrove.
#
# ATTENZIONE su AlmaLinux/RHEL: con SELinux attivo nginx non può connettersi a
# un servizio locale e il proxy risponde 502. Una volta sola, sul server:
#   setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    listen [::]:80;
    server_name bancarella.esempio.it;

    access_log /var/log/nginx/bancarella.access.log;
    error_log  /var/log/nginx/bancarella.error.log;

    # I corpi delle richieste sono minuscoli: qui passano solo dati di vendita.
    client_max_body_size 1m;

    # Lasciata in chiaro anche dopo il passaggio a HTTPS, per i rinnovi.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Dice a Next che l'utente è arrivato in HTTPS, anche se il proxy
        # parla con l'applicazione in HTTP sulla rete locale.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
